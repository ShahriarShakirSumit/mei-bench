# MEI Benchmark - Open-source Models Configuration
# =================================================
# Configurations for all open-source VLLMs to be evaluated

models:
  # ------- LLaVA Family -------
  llava-1.5-7b:
    model_name: "LLaVA-1.5-7B"
    model_id: "llava-hf/llava-1.5-7b-hf"
    revision: "b234b804b114d9e37bb655e11cbbb5f5e971b7a9"   # weights used in the paper
    wrapper_class: "mei_benchmark.models.llava:LLaVAWrapper"
    device: "cuda:0"
    dtype: "float16"
    max_new_tokens: 128
    temperature: 0.0
    batch_size: 4
    use_flash_attention: true
    pbs:
      queue: "gpuvolta"
      ncpus: 12
      ngpus: 1
      mem: "48GB"
      walltime: "04:00:00"
      jobfs: "10GB"

